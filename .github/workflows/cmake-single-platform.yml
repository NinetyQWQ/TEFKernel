name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]          # 打 tag 时才触发 Release 发布
  pull_request:
  workflow_dispatch:

permissions:
  contents: write           # softprops/action-gh-release 需要写 Release 的权限

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------- Linux ----------
          - name: linux-x86_64
            os: ubuntu-latest
            cmake_args: ""
            ext: .so

          # ---------- macOS (Apple Silicon) ----------
          - name: mac-arm64
            os: macos-latest
            cmake_args: ""
            ext: .dylib

          # ---------- Windows (MinGW x86_64) ----------
          - name: windows-x86_64
            os: windows-latest
            cmake_args: '-G "MinGW Makefiles"'
            ext: .dll

          # ---------- Android arm64-v8a ----------
          - name: android-arm64
            os: ubuntu-latest
            cmake_args: >
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
              -DANDROID_ABI=arm64-v8a
              -DANDROID_PLATFORM=android-21
            ext: .so

          # ---------- Android armeabi-v7a ----------
          - name: android-armv7
            os: ubuntu-latest
            cmake_args: >
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
              -DANDROID_ABI=armeabi-v7a
              -DANDROID_PLATFORM=android-21
            ext: .so

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout (含子模块)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---------- 各平台环境准备 ----------
      - name: Setup Ninja (Linux/macOS)
        if: runner.os != 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup MinGW (Windows)
        if: runner.os == 'Windows'
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Setup NDK (Android)
        if: contains(matrix.name, 'android')
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true

      # ---------- CMake 配置 ----------
      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.cmake_args }}

      # ---------- 构建 ----------
      - name: Build
        shell: bash
        run: cmake --build build --config Release -j $(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 4)

      # ---------- 收集产物 ----------
      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p dist
          # 你的 OUTPUT_NAME 是 tefkernel.<system>.<arch>.<ext>，直接匹配 target 产物
          find build -maxdepth 3 \( -name "tefkernel.*" -o -name "*tefkernel*" \) \
            -type f \( -name "*.so" -o -name "*.dylib" -o -name "*.dll" \) \
            -exec cp -v {} dist/ \; || true
          # 若产物在特定子目录（如 Release/），再兜底扫一次
          find build -name "tefkernel.*" -type f -exec cp -v {} dist/ \; 2>/dev/null || true
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tefkernel-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # ================= 统一发布 Release =================
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -lhR release-assets/

      - name: Create Release & Upload
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
